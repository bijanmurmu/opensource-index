name: Fetch Data and Deploy Site

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # The manual "Run workflow" button
  push:
    branches: ["main"] # Also deploys whenever you push CSS/HTML changes

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Latest GitHub Data
        run: node fetch_data.js
        env:
          # Note: A custom PAT is required here because the default GITHUB_TOKEN
          # cannot access data from repositories outside this one via GraphQL.
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Auto Cache Busting
        run: sed -i "s/?v=[0-9]*/?v=${GITHUB_SHA::7}/g" index.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Uploads everything in the repository

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
